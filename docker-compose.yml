name: bytebase-permission-poc

services:
  bytebase:
    container_name: bytebase
    image: bytebase-permission-poc:local
    pull_policy: build
    build:
      context: .
      dockerfile: scripts/Dockerfile
      args:
        VERSION: permission-poc
        GIT_COMMIT: ${GIT_COMMIT:-local}
        BB_PERMISSION_POC: "1"
        # The release tag selects production mode, which the PoC rejects.
        GO_BUILD_TAGS: embed_frontend,docker,permission_poc
    restart: unless-stopped
    init: true
    ports:
      - "${BYTEBASE_BIND_ADDRESS:-0.0.0.0}:${BYTEBASE_PORT:-8088}:8080"
    command:
      - --port
      - "8080"
      - --data
      - /var/opt/bytebase
      - --external-url
      - ${BYTEBASE_EXTERNAL_URL:-http://localhost:8088}
    volumes:
      - ~/.bytebase/data:/var/opt/bytebase
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
